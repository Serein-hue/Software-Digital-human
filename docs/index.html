<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="景区导览 AI 数字人 - Word 转 Markdown 与 PRD 发布页">
    <title>景区导览 AI 数字人</title>
    <style>
      :root {
        --paper: #faf8f1;
        --ink: #20231f;
        --muted: #62665d;
        --line: #ded8c9;
        --teal: #155d58;
        --rust: #b4522c;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        background:
          linear-gradient(90deg, rgba(32, 35, 31, 0.04) 1px, transparent 1px),
          linear-gradient(rgba(32, 35, 31, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 48px 48px;
        color: var(--ink);
      }
      .shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 56px 20px 80px;
      }
      .hero {
        display: grid;
        gap: 18px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,.78);
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.08;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        text-decoration: none;
        background: rgba(255,255,255,.8);
      }
      .primary {
        border-color: rgba(21,93,88,.28);
        background: rgba(21,93,88,.08);
      }
      .secondary {
        border-color: rgba(180,82,44,.28);
        background: rgba(180,82,44,.08);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .card {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,.76);
      }
      .card span {
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .card strong {
        display: block;
        margin-top: 8px;
        font-size: 18px;
      }
      @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <span style="color: var(--rust); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">中国软件杯 2026 A5</span>
        <h1>景区导览 AI 数字人</h1>
        <p>这是 Word 转 Markdown 后的发布页，也是 GitHub Pages 的入口。应用站点在 <code>docs/app/</code>，可直接浏览 PRD、ao-output 原文、竞品分析和指标标准。</p>
        <div class="links">
          <a class="primary" href="./app/">打开 React 站点</a>
          <a class="secondary" href="./index.md">查看 Markdown 原文</a>
        </div>
      </section>
      <section class="grid">
        <article class="card">
          <span>content</span>
          <strong>Markdown 文档</strong>
          <p>保留原始调研报告的 Markdown 版本，适合直接阅读和版本比对。</p>
        </article>
        <article class="card">
          <span>app</span>
          <strong>React 浏览器</strong>
          <p>多路由站点，支持文档阅读、竞品分析、流程图和指标标准。</p>
        </article>
        <article class="card">
          <span>docs</span>
          <strong>Github Pages</strong>
          <p>可以直接作为发布入口，静态查看原文和应用入口。</p>
        </article>
      </section>
    </main>
  </body>
</html>
