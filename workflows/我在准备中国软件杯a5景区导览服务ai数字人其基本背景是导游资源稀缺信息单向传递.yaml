name: "景区导览AI数字人产品调研与PRD工作流"
description: "为中国软件杯A5赛题——景区导览服务AI数字人项目，产出完整的产品调研报告与PRD文档"
agents_dir: "agency-agents-zh"
llm:
  provider: claude-code
  max_tokens: 4096
  timeout: 300000
  retry: 2
concurrency: 4
steps:
  - id: trend_research
    role: "product/product-trend-researcher"
    name: "趋势研究员"
    emoji: "📈"
    task: |
      为"中国软件杯A5赛题——景区导览服务AI数字人"项目撰写行业趋势调研部分（800字以内）。

      项目背景：当前景区面临导游资源稀缺、信息单向传递、缺乏情感连接、管理盲区四大痛点。

      请输出以下内容：
      1. 智慧文旅与景区数字化的政策背景（"十四五"文旅规划、智慧景区建设标准、AAAA/AAAAA景区数字化要求）
      2. AI数字人赛道市场规模与增长预测（2024-2026），头部玩家梳理（百度希加加、商汤如影、科大讯飞虚拟人、网易伏羲、腾讯小微等）
      3. 文旅+AI数字人的典型落地案例（如故宫、敦煌、黄山、乌镇等景区已有的数字人/AR导览实践）
      4. 多模态大模型、数字人渲染、实时语音合成等关键技术的成熟度判断
      5. 未来6-18个月趋势预判：哪些技术/形态最值得押注

      输出格式：清晰的小标题分段，关键数据带来源标注（即使是估算也要说明依据）。
    output: trend_report

  - id: user_research
    role: "design/design-ux-researcher"
    name: "用户研究员"
    emoji: "🔍"
    task: |
      为"景区导览服务AI数字人"项目撰写用户研究部分（800字以内）。

      请围绕以下三类核心用户进行画像与需求分析：
      1. C端游客（细分为：亲子家庭、Z世代年轻人、银发族、外国游客、深度文化爱好者）
        - 各自的游览动机、信息获取习惯、对讲解的偏好
        - 对AI数字人交互的期待与顾虑（隐私、准确性、情感温度）
      2. B端景区管理方（景区运营经理、讲解部门主管、市场部）
        - 业务诉求：提升服务能力、降低人力成本、获取游客行为洞察
        - 当前管理盲区的具体表现（哪些区域客流密集、哪些讲解点游客停留少等）
      3. 政府/文旅主管部门（数据上报、文化输出、安全管控）

      输出内容包括：
      - 3-5个典型用户画像卡片（姓名/年龄/场景/痛点/期待功能）
      - 用户旅程地图：游前、游中、游后三个阶段的触点与机会点
      - 核心痛点排序（用Kano模型或MoSCoW分类）
      - 5条最关键的用户洞察（直接指向产品功能设计）

      输出格式：结构化分块，便于后续PRD直接引用。
    output: user_report

  - id: competitor_analysis
    role: "product/product-feedback-synthesizer"
    name: "竞品分析师"
    emoji: "🥊"
    task: |
      为"景区导览服务AI数字人"项目撰写竞品分析部分（800字以内）。

      请覆盖以下竞品矩阵：
      1. 传统语音导览类：三毛游、氢气球、链景旅行、各景区官方小程序导览
      2. AI数字人类：百度希加加、商汤如影、阿里"通义万相"虚拟人、网易伏羲有灵、腾讯智影
      3. 文旅大模型类：百度文心文旅大模型、华为盘古文旅、讯飞星火文旅
      4. 国际对标：Google Arts & Culture、Smartify、Cuseum的AI讲解、迪士尼数字人

      请输出：
      - 竞品功能对比矩阵表（横轴：多模态交互/智能问答/个性化推荐/知识库管理/数字人形象/数据看板；纵轴：各竞品；用 ✅ ⚠️ ❌ 标识）
      - 每个细分赛道Top 2竞品的优势与短板（不超过3条）
      - 市场空白点与差异化机会（至少5条，针对中国软件杯评审视角，强调技术创新性、社会价值、商业闭环）
      - 我们的产品定位建议：一句话Slogan + 三个核心差异化卖点

      要求：客观、具体、可落地，避免空话套话。
    output: competitor_report

  - id: tech_feasibility
    role: "engineering/engineering-ai-engineer"
    name: "AI技术架构师"
    emoji: "🤖"
    task: |
      为"景区导览服务AI数字人"项目撰写技术可行性分析部分（800字以内）。

      项目核心功能：多模态交互、智能问答与讲解、个性化推荐、知识库管理、数字人形象管理、游客感受度报告、数据大屏概览。

      请按以下技术栈进行分析：
      1. 多模态交互层：ASR（讯飞/阿里/Whisper）、TTS（VITS/GPT-SoVITS/讯飞超拟人）、CV手势识别、视觉问答（VQA）、唇形同步（Wav2Lip/SadTalker/MuseTalk）
      2. 数字人形象层：2D数字人（Live2D/AnimateAnyone）vs 3D数字人（UE MetaHuman/Unity）、实时驱动方案、形象生成（StyleGAN/Diffusion）、低端设备适配
      3. 智能问答层：RAG架构选型（LangChain/LlamaIndex/Dify）、向量库（Milvus/Qdrant/ChromaDB）、基座模型（通义千问/文心/DeepSeek/Qwen2.5）、本地部署vs API
      4. 知识库管理：景区知识图谱构建、文档解析（PDF/图片OCR/语音）、增量更新机制
      5. 个性化推荐：用户画像建模、协同过滤+内容推荐混合策略、冷启动方案
      6. 数据大屏：埋点采集、实时流处理（Flink/Kafka）、可视化（ECharts/AntV）
      7. 部署架构：云端+边缘混合部署、景区弱网/无网降级方案

      输出每个模块的：技术选型建议、关键风险点、开发工作量评估（人天）、是否能在中国软件杯参赛周期内落地。

      重点：识别3个最具技术挑战的环节并给出预案。
    output: tech_report

  - id: research_report
    role: "product/product-manager"
    name: "产品经理"
    emoji: "📊"
    depends_on: [trend_research, user_research, competitor_analysis, tech_feasibility]
    task: |
      你是中国软件杯A5赛题项目的产品经理，请整合下方四份调研材料，产出一份完整的《景区导览服务AI数字人——产品调研报告》。

      【行业趋势】
      {{trend_report}}

      【用户研究】
      {{user_report}}

      【竞品分析】
      {{competitor_report}}

      【技术可行性】
      {{tech_report}}

      报告结构（标准产品调研报告格式，2000字以内）：
      1. 执行摘要（200字，老板视角的TL;DR）
      2. 项目背景与立项依据（导游资源稀缺、信息单向传递、缺乏情感连接、管理盲区四大痛点的具体阐述）
      3. 行业趋势与市场机会（精炼自趋势报告）
      4. 目标用户与核心需求（精炼自用户研究，输出明确的用户分层）
      5. 竞品分析与差异化定位（精炼自竞品分析，明确我们的SWOT）
      6. 技术可行性结论（精炼自技术报告，红黄绿灯标注每个功能）
      7. 产品价值主张：用一句话+三个支撑点说清楚我们解决什么问题
      8. 商业模式与社会价值（中国软件杯评审会看重的社会价值、文化传承、共同富裕维度）
      9. 风险评估与应对（技术、市场、合规、参赛周期四个维度）
      10. 结论与下阶段行动建议

      要求：观点鲜明、数据支撑、可直接作为参赛答辩材料。
    output: research_report_full

  - id: prd_interaction
    role: "product/product-manager"
    name: "交互模块产品经理"
    emoji: "🎙️"
    depends_on: [research_report]
    task: |
      基于以下产品调研报告，撰写PRD的"前端交互模块"详细需求文档（800字以内）。

      【调研报告】
      {{research_report_full}}

      本模块覆盖两大功能：
      A. 多模态交互（语音/文本/图像/手势/AR扫一扫）
      B. 智能问答与讲解（场景化讲解、问答机器人、主动推送讲解）

      请按标准PRD格式输出：
      1. 模块定位与核心价值
      2. 功能清单（用功能树呈现，每个叶子节点标注P0/P1/P2优先级）
      3. 核心用户故事（5-8条，As a... I want... So that... 格式）
      4. 关键交互流程（描述2-3个核心场景的步骤流，如"游客走到景点前自动触发讲解"）
      5. 功能详细规格：
         - 输入方式：支持中/英/方言语音、文字、拍照识景、AR扫描
         - 唤醒/中断机制
         - 讲解内容分级（基础版/深度版/儿童版）
         - 主动讲解触发条件（地理围栏、停留时长、用户画像）
      6. 边界条件与异常处理（弱网、嘈杂环境、识别失败）
      7. 验收标准（响应延迟≤Xs、识别准确率≥X%等可量化指标）
    output: prd_interaction

  - id: prd_content_engine
    role: "product/product-manager"
    name: "内容引擎产品经理"
    emoji: "📚"
    depends_on: [research_report]
    task: |
      基于以下产品调研报告，撰写PRD的"内容引擎模块"详细需求文档（800字以内）。

      【调研报告】
      {{research_report_full}}

      本模块覆盖两大功能：
      A. 个性化推荐（路线推荐、景点推荐、餐饮/购物/住宿推荐）
      B. 知识库管理（景区资料录入、知识图谱、内容审核、版本管理）

      请按标准PRD格式输出：
      1. 模块定位与核心价值
      2. 功能清单（功能树+P0/P1/P2）
      3. 核心用户故事（C端游客视角 + B端运营视角各3-4条）
      4. 关键流程：
         - 个性化推荐流程：用户画像采集→标签计算→推荐召回→排序→曝光→反馈闭环
         - 知识库流程：内容上传→自动解析（OCR/ASR/PDF）→人工审核→入库→向量化→RAG调用
      5. 功能详细规格：
         - 推荐策略：冷启动方案、多臂老虎机、explore/exploit比例
         - 知识库支持的内容类型（文本/图片/音频/视频/3D模型）
         - 知识图谱实体设计（景点/人物/朝代/事件/典故）
         - 内容时效性管理（节假日特殊内容、闭馆通知）
      6. 后台管理界面要点（B端景区运营人员日常使用）
      7. 验收标准（推荐CTR、知识库召回率、内容审核效率等）
    output: prd_content

  - id: prd_digital_human
    role: "product/product-manager"
    name: "数字人形象产品经理"
    emoji: "👤"
    depends_on: [research_report]
    task: |
      基于以下产品调研报告，撰写PRD的"数字人形象管理模块"详细需求文档（800字以内）。

      【调研报告】
      {{research_report_full}}

      本模块核心功能：数字人形象设计、形象库管理、形象与景区文化的匹配、表情与动作驱动、个性化定制。

      请按标准PRD格式输出：
      1. 模块定位与核心价值（为什么数字人形象对景区导览至关重要：文化IP、情感连接、记忆点）
      2. 功能清单（功能树+P0/P1/P2）
      3. 核心用户故事（含C端用户切换形象、B端景区配置专属形象两类）
      4. 形象库设计：
         - 通用形象库（不同年龄、性别、风格的预制数字人）
         - 文化主题形象库（古风/民国/少数民族/历史人物等，呼应不同景区调性）
         - 自定义形象（B端景区上传素材生成专属IP，如"敦煌飞天小姐姐""黄山迎客松爷爷"）
      5. 驱动能力规格：
         - 表情：喜怒哀乐+文化表达（如惊叹、敬仰、神秘）
         - 动作：讲解手势、指引动作、文化舞蹈片段
         - 唇形同步精度（音素级 vs 句子级）
         - 多语言唇形适配
      6. 形象与场景的智能匹配（不同景点自动切换最合适的形象与服饰）
      7. B端形象管理后台：上传/编辑/上下架/A-B测试
      8. 验收标准（渲染帧率、唇形同步延迟、用户喜爱度评分）
    output: prd_digital

  - id: prd_analytics
    role: "product/product-manager"
    name: "数据运营产品经理"
    emoji: "📉"
    depends_on: [research_report]
    task: |
      基于以下产品调研报告，撰写PRD的"数据运营模块"详细需求文档（800字以内）。

      【调研报告】
      {{research_report_full}}

      本模块覆盖两大功能：
      A. 游客感受度报告（情感分析、满意度、个人游记、对外分享）
      B. 数据大屏概览（B端景区管理方实时看板）

      请按标准PRD格式输出：
      1. 模块定位与核心价值（解决"管理盲区"痛点——让景区第一次"看见"游客的真实感受）
      2. 功能清单（功能树+P0/P1/P2）
      3. 核心用户故事（C端游客获取个人游记/B端景区管理方运营决策）
      4. 游客感受度报告设计：
         - 数据来源：交互记录、停留时长、问答情绪、主动反馈、面部表情（可选）
         - 报告内容：游览路线热力图、个人偏好画像、情感曲线、文化兴趣标签、推荐回访的景点
         - 分享形式：H5海报、小红书/抖音模板、微信小程序卡片
      5. 数据大屏设计：
         - 核心指标：实时在线人数、客流密度热力图、各讲解点播放量TOP10、问题Top榜（暴露管理盲区）、整体满意度趋势、数字人交互转化漏斗
         - 告警机制：客流超载、负面情绪聚集、讲解点冷区
         - 大屏布局：1+N分屏（中央地图+周边KPI卡片）
      6. 数据合规：游客授权、PII脱敏、数据本地化
      7. 验收标准（大屏刷新延迟≤Xs、报告生成时间≤Xs、情感分析准确率≥X%）
    output: prd_analytics

  - id: final_delivery
    role: "specialized/specialized-document-generator"
    name: "文档总编"
    emoji: "📝"
    depends_on: [research_report, prd_interaction, prd_content_engine, prd_digital_human, prd_analytics]
    task: |
      你是中国软件杯A5赛题项目的文档总编，请将以下材料整合为两份完整的最终交付物，按顺序连续输出，每份之间用"=========="分隔。

      【产品调研报告】
      {{research_report_full}}

      【PRD-前端交互模块】
      {{prd_interaction}}

      【PRD-内容引擎模块】
      {{prd_content}}

      【PRD-数字人形象模块】
      {{prd_digital}}

      【PRD-数据运营模块】
      {{prd_analytics}}

      ===== 交付物一：《景区导览服务AI数字人——产品调研报告》=====
      直接采用上方调研报告内容，按标准报告格式排版（封面信息、目录、正文、附录）。封面信息包括：项目名称（中国软件杯A5——景区导览服务AI数字人）、文档版本V1.0、日期2026-05-18。

      ===== 交付物二：《景区导览服务AI数字人——产品需求文档PRD V1.0》=====
      标准PRD结构：
      1. 文档信息（版本、作者、日期、修订记录）
      2. 项目概述
         2.1 项目背景（四大痛点）
         2.2 产品定位与目标用户
         2.3 核心价值主张
      3. 产品架构图（用文字描述：交互层/数字人层/AI能力层/知识库层/数据层/管理后台层 的分层架构）
      4. 功能详细需求
         4.1 前端交互模块（整合prd_interaction）
         4.2 内容引擎模块（整合prd_content）
         4.3 数字人形象模块（整合prd_digital）
         4.4 数据运营模块（整合prd_analytics）
      5. 非功能性需求（性能、安全、合规、可扩展性）
      6. 项目里程碑（针对中国软件杯参赛节奏，划分4个阶段）
      7. 风险与开放问题
      8. 附录：术语表、参考资料

      要求：
      - 整合时去除各分模块的重复内容（如重复的背景介绍）
      - 保持各PRD细节不丢失
      - 行文统一为产品文档语气
      - 输出为可直接用于答辩与团队开发的完整定稿，而非修改建议
    output: final_documents
