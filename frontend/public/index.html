<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵山胜境 · AI 数字人平台</title>
  <style>
    :root {
      --paper: #faf8f1;
      --ink: #20231f;
      --muted: #62665d;
      --teal: #155d58;
      --rust: #b4522c;
      --line: #ded8c9;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(90deg, rgba(32,35,31,.04) 1px, transparent 1px), linear-gradient(rgba(32,35,31,.035) 1px, transparent 1px), var(--paper);
      background-size: 48px 48px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 640px;
      width: 90%;
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .grid { display: grid; gap: 12px; }
    .grid a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: all .15s;
      background: rgba(255,255,255,.6);
    }
    .grid a:hover {
      border-color: var(--teal);
      background: rgba(21,93,88,.06);
    }
    .grid a .arrow { color: var(--muted); font-size: 18px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: var(--paper);
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#155d58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4.5 7.5 8 12"/><path d="M16 3 19.5 7.5 16 12"/><path d="M12 3 9 9l3 6 3-6Z"/><path d="M2 21h20"/><path d="M4 21V12h16v9"/></svg>
      灵山胜境 · AI 数字人平台
    </div>
    <p class="sub">中国软件杯 2026 A5 · 锐捷网络 出题</p>

    <div class="grid">
      <a href="./operation/">
        <span>🖥️ 运营中心 <span class="badge">指挥调度 · 工单处理</span></span>
        <span class="arrow">→</span>
      </a>
      <a href="./bigscreen/">
        <span>📊 数据大屏 <span class="badge">客流趋势 · 游客画像</span></span>
        <span class="arrow">→</span>
      </a>
      <a href="./digital-human/">
        <span>🤖 数字人管理 <span class="badge">形象配置 · 运行监控</span></span>
        <span class="arrow">→</span>
      </a>
      <a href="./admin/">
        <span>⚙️ 后台管理 <span class="badge">系统设置 · 知识库 · 内容审核</span></span>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>GitHub Pages · 静态部署</footer>
  </div>
</body>
</html>
