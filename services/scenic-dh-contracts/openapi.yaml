openapi: "3.0.3"
info:
  title: scenic-dh 智慧景区数字人平台 API
  version: "1.0.0"
  description: |
    三端协作的唯一契约面。
    - **接口负责人**: business-api, admin-api, demo-mock-service
    - **RAG 负责人**: rag-service
    - **数字人负责人**: avatar-orchestrator, fay-runtime
  contact:
    name: scenic-dh team

servers:
  - url: http://localhost:8001/v1
    description: business-api 本地
  - url: http://localhost:8002/v1
    description: admin-api 本地
  - url: http://localhost:8003/api/v1
    description: rag-service 本地
  - url: http://localhost:8004/v1
    description: avatar-orchestrator 本地
  - url: http://localhost:8005/internal/v1
    description: fay-runtime 本地
  - url: http://localhost:8006/v1
    description: demo-mock-service 本地

tags:
  - name: Health
  - name: Spots
  - name: Routes
  - name: Sessions
  - name: Messages
  - name: Arrivals
  - name: Feedback
  - name: Context
  - name: Scenic Info
  - name: Demo
  - name: Knowledge
  - name: Personas
  - name: Broadcasts
  - name: Audit
  - name: Analytics
  - name: Runtime
  - name: Map
  - name: QR Code
  - name: Reservations
  - name: Work Orders
  - name: Emergency
  - name: Offline
  - name: Auth
  - name: Users
  - name: Roles
  - name: Content
  - name: Config

# ============================================================
# 通用组件
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 统一使用 Authorization: Bearer <token>

  schemas:
    # ---- 基础 ----
    TraceHeaders:
      type: object
      properties:
        x-trace-id:
          type: string
          format: uuid
          description: 链路追踪 ID，贯穿整条调用链
        x-span-id:
          type: string
          description: 本次 span ID

    ResponseEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: integer
          description: 0=成功，正数=业务错误，负数=系统错误
        message:
          type: string
          description: success 或错误描述
        data:
          description: 业务数据；错误时为 null
        trace_id:
          type: string
          description: 链路追踪 ID，从 X-Trace-Id 继承或自动生成 trace_ + 32 位 hex

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        total:
          type: integer
        total_pages:
          type: integer

    # ---- 核心业务对象 ----
    ScenicArea:
      type: object
      properties:
        id:
          type: string
          example: "SA-001"
        name:
          type: string
          example: "灵山胜境"
        nameEn:
          type: string
          example: "Lingshan Buddhist Scenic Spot"
        level:
          type: string
          example: "5A"
        city:
          type: string
          example: "无锡"
        intro:
          type: string
        openTime:
          type: string
          example: "07:00-17:30"
        rules:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [public_demo_package, manual_seed, mock, official]
        freshnessLevel:
          type: string
          enum: [high, medium, low, static]

    Spot:
      type: object
      properties:
        id:
          type: string
          example: "LS-001"
        scenicId:
          type: string
          example: "SA-001"
        name:
          type: string
          example: "灵山大佛"
        nameEn:
          type: string
        tags:
          type: array
          items:
            type: string
          example: ["佛教文化", "标志性建筑", "必游"]
        location:
          type: string
          example: "景区中轴线北端"
        summary:
          type: string
          description: 一句话简介
        intro:
          type: string
          description: 详细介绍
        highlights:
          type: array
          items:
            type: string
          description: 游玩亮点
        images:
          type: array
          items:
            type: string
            format: uri
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'
        freshnessLevel:
          $ref: '#/components/schemas/ScenicArea/properties/freshnessLevel'

    SpotGuide:
      type: object
      properties:
        spotId:
          type: string
        shortText:
          type: string
          description: 一句话讲解（≤20字）
        briefText:
          type: string
          description: 30 秒简短讲解
        longText:
          type: string
          description: 3 分钟深度讲解
        fallbackText:
          type: string
          description: 无法获取实时数据时的兜底讲解
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'

    Route:
      type: object
      properties:
        id:
          type: string
          example: "RT-001"
        scenicId:
          type: string
        name:
          type: string
          example: "历史文化深度游"
        type:
          type: string
          enum: [culture, nature, family, quick]
        duration:
          type: string
          example: "约 6 小时"
        persona:
          type: string
          description: 适合人群
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
        tips:
          type: string
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'

    RouteStop:
      type: object
      properties:
        order:
          type: integer
        spotId:
          type: string
        spotName:
          type: string
        stayDuration:
          type: string
          example: "60 分钟"
        description:
          type: string

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profile:
          type: object
          properties:
            language:
              type: string
              enum: [zh, en]
              default: zh
            interests:
              type: array
              items:
                type: string
            groupSize:
              type: integer
            hasChildren:
              type: boolean
        source:
          type: string
          enum: [web, miniprogram, kiosk, demo]
        currentSpotId:
          type: string
        currentRouteId:
          type: string
        status:
          type: string
          enum: [active, paused, ended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        fallback:
          type: boolean
        fallbackReason:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        speechState:
          type: string
          enum: [queued, speaking, done, failed, interrupted]
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time

    Citation:
      type: object
      properties:
        sourceName:
          type: string
        page:
          type: string
        section:
          type: string
        quote:
          type: string
        chunkId:
          type: string
        docId:
          type: string
        confidence:
          type: number
          format: float

    ArrivalEvent:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        spotId:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          description: 模拟坐标
        trigger:
          type: string
          enum: [lbs, manual, demo]
        accepted:
          type: boolean
          description: 是否通过防抖检查
        speechState:
          type: string
          enum: [queued, speaking, done, failed]
        createdAt:
          type: string
          format: date-time

    Feedback:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        messageId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        resolved:
          type: boolean
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ContextQueryResult:
      type: object
      properties:
        intent:
          type: string
        spot:
          $ref: '#/components/schemas/Spot'
        route:
          $ref: '#/components/schemas/Route'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceFacility'
        weather:
          $ref: '#/components/schemas/WeatherInfo'
        confidence:
          type: number

    Notice:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [announcement, alert, info, emergency]
        title:
          type: string
        content:
          type: string
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time

    ServiceFacility:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [toilet, shop, restaurant, parking, help_point, medical, nursery, rest_area]
        name:
          type: string
        location:
          type: string

    WeatherInfo:
      type: object
      properties:
        scenicId:
          type: string
        temperature:
          type: number
        weather:
          type: string
        warning:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'

    QueueInfo:
      type: object
      properties:
        spotId:
          type: string
        queueMinutes:
          type: integer
        crowdLevel:
          type: string
          enum: [low, medium, high, very_high]
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'

    TicketProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [available, limited, sold_out]
        source:
          $ref: '#/components/schemas/ScenicArea/properties/source'

    # ---- 管理端对象 ----
    KnowledgeStatus:
      type: object
      properties:
        scenicId:
          type: string
        documents:
          type: integer
        chunks:
          type: integer
        updatedAt:
          type: string
          format: date-time

    IngestJob:
      type: object
      properties:
        id:
          type: string
        scenicId:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        failedFiles:
          type: array
          items:
            type: string
        chunks:
          type: integer

    Persona:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tone:
          type: string
          enum: [professional, friendly, lively, solemn]
        fallbackPolicy:
          type: object

    Broadcast:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        priority:
          type: string
          enum: [low, normal, high, emergency]
        target:
          type: string
          enum: [all, spot, session]
        targetId:
          type: string
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued, speaking, done, expired]

    AnalyticsOverview:
      type: object
      properties:
        activeSessions:
          type: integer
        totalMessages:
          type: integer
        avgRating:
          type: number
        fallbackRate:
          type: number
        ragHitRate:
          type: number
        avatarUptime:
          type: number

    RuntimeStatus:
      type: object
      properties:
        fayOnline:
          type: boolean
        ttsOnline:
          type: boolean
        speaking:
          type: boolean
        queueLength:
          type: integer
        lastError:
          nullable: true

    DemoState:
      type: object
      properties:
        scenarioId:
          type: string
        currentStep:
          type: integer
        totalSteps:
          type: integer
        status:
          type: string
          enum: [idle, running, paused, done]
        stepResult:
          nullable: true

    # ---- P0 新增: 地图 ----
    MapPOI:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [spot, toilet, shop, restaurant, parking, help_point, medical, nursery, rest_area, entrance, exit]
        lat:
          type: number
        lng:
          type: number
        icon:
          type: string
        status:
          type: string
          enum: [open, closed, maintenance]

    MapLayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [poi, route, crowd, restricted, facility]
        visible:
          type: boolean
        zIndex:
          type: integer

    # ---- P0 新增: 二维码 ----
    QRCodeResult:
      type: object
      properties:
        codeId:
          type: string
        type:
          type: string
          enum: [spot, ticket, device, event]
        targetId:
          type: string
        targetName:
          type: string
        action:
          type: string
          enum: [navigate_guide, verify_ticket, queue_number, event_detail, device_info]
        meta:
          type: object
          description: 附加信息，按 action 不同结构

    # ---- P0 新增: 票务扩展 ----
    TicketOrder:
      type: object
      properties:
        orderId:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending, paid, used, refunded, expired]
        visitDate:
          type: string
          format: date
        ticketCode:
          type: string
          description: 入园核验码

    TicketVerifyResult:
      type: object
      properties:
        valid:
          type: boolean
        orderId:
          type: string
        ticketCode:
          type: string
        productName:
          type: string
        visitDate:
          type: string
          format: date
        reason:
          type: string
          description: 无效原因

    # ---- P0 新增: 预约排队 ----
    Reservation:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        resourceType:
          type: string
          enum: [show, spot, facility]
        resourceId:
          type: string
        resourceName:
          type: string
        timeSlot:
          type: string
        status:
          type: string
          enum: [booked, checked_in, cancelled, expired]
        queueNumber:
          type: integer
        createdAt:
          type: string
          format: date-time

    QueueTicket:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        queueId:
          type: string
        queueName:
          type: string
        number:
          type: integer
        waitingMinutes:
          type: integer
        peopleAhead:
          type: integer
        status:
          type: string
          enum: [waiting, called, passed, cancelled]
        calledAt:
          nullable: true

    # ---- P0 新增: 工单 ----
    WorkOrder:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum: [complaint, feedback, emergency, low_confidence]
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        status:
          type: string
          enum: [pending, assigned, processing, resolved, closed]
        assignee:
          type: string
        sla:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        contactPhone:
          type: string
        resolution:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmergencyRequest:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum: [sos, medical, lost_child, security, other]
        description:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        contactPhone:
          type: string
        status:
          type: string
          enum: [pending, dispatched, responding, resolved]
        responderNote:
          type: string
        createdAt:
          type: string
          format: date-time

    # ---- P0 新增: 离线包 ----
    OfflinePackage:
      type: object
      properties:
        version:
          type: string
        sizeBytes:
          type: integer
        manifest:
          type: object
          properties:
            spots:
              type: integer
            guides:
              type: integer
            notices:
              type: integer
            maps:
              type: integer
        checksum:
          type: string
        forceUpdate:
          type: boolean
        releaseNotes:
          type: string
        downloadUrl:
          type: string
          format: uri

    # ---- P0 新增: Auth / RBAC ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/AdminUser'

    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        userCount:
          type: integer

    # ---- P0 新增: 内容管理 ----
    ContentItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [spot, route, facility, notice, event, ticket_policy]
        title:
          type: string
        body:
          type: object
          description: 类型相关的完整内容
        version:
          type: integer
        status:
          type: string
          enum: [draft, pending_review, approved, published, rejected, revoked]
        authorId:
          type: string
        reviewerId:
          type: string
        publishedAt:
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentApproval:
      type: object
      properties:
        id:
          type: string
        contentId:
          type: string
        action:
          type: string
          enum: [approve, reject, revoke]
        comment:
          type: string
        reviewerId:
          type: string
        diff:
          type: object
          description: 版本间差异
        createdAt:
          type: string
          format: date-time

    # ---- P0 新增: 运营聚合 ----
    OpsSnapshot:
      type: object
      properties:
        todayVisitors:
          type: integer
        activeSessions:
          type: integer
        queuedVisitors:
          type: integer
        activeEvents:
          type: integer
        onlineDevices:
          type: integer
        alerts:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
                enum: [info, warning, critical]
              text:
                type: string
        pendingWorkOrders:
          type: integer

    # ---- P0 新增: 配置 ----
    ConfigEntry:
      type: object
      properties:
        key:
          type: string
        value: {}
        type:
          type: string
          enum: [string, number, boolean, json]
        description:
          type: string
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

security:
  - BearerAuth: []

# ============================================================
# 路径
# ============================================================
paths:
  # ===== Health =====
  /health:
    get:
      tags: [Health]
      summary: 健康检查（所有服务必须实现）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                          version:
                            type: string
                          dependencies:
                            type: object

  # ===== Spots (business-api) =====
  /spots:
    get:
      tags: [Spots]
      summary: 景点列表
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Spot'
                          total:
                            type: integer

  /spots/{spotId}:
    get:
      tags: [Spots]
      summary: 景点详情
      parameters:
        - name: spotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Spot'
        '404':
          description: 景点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'

  /spots/{spotId}/guide:
    get:
      tags: [Spots]
      summary: 景点讲解词
      parameters:
        - name: spotId
          in: path
          required: true
          schema:
            type: string
        - name: style
          in: query
          schema:
            type: string
            enum: [short, brief, long]
        - name: duration
          in: query
          schema:
            type: string
            enum: [one_sentence, 30s, 3min]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpotGuide'

  /scenic-areas/{scenicId}:
    get:
      tags: [Scenic Info]
      summary: 景区基础资料
      parameters:
        - name: scenicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
