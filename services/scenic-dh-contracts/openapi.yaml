      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [spot, route, facility, notice, event, ticket_policy]
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, approved, published, rejected, revoked]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
    post:
      tags: [Content]
      summary: 创建内容草稿
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, body]
              properties:
                type:
                  type: string
                  enum: [spot, route, facility, notice, event, ticket_policy]
                title:
                  type: string
                body:
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContentItem'

