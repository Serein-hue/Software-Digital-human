  /tickets/orders:
    get:
      tags: [Scenic Info]
      summary: 票务订单状态查询（只读）
      parameters:
        - name: ticketCode
          in: query
          schema:
            type: string
          description: 入园核验码
        - name: phone
          in: query
          schema:
            type: string
          description: 订票手机号
        - name: orderId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/TicketOrder'

  /tickets/verify:
    post:
      tags: [Scenic Info]
      summary: 票码核验（只读）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketCode]
              properties:
                ticketCode:
                  type: string
                sessionId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketVerifyResult'

